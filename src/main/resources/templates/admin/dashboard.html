<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administration - Gym Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Administration</h1>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-secondary">Sign out</button>
        </form>
    </div>
    <div class="row g-3">
        <div sec:authorize="hasRole('ADMIN')" class="col-md-4"><a class="card card-body text-decoration-none h-100" th:href="@{/admin/users}"><h2 class="h5">Users</h2><span class="text-secondary">Manage members and staff</span></a></div>
        <div sec:authorize="hasRole('ADMIN')" class="col-md-4"><a class="card card-body text-decoration-none h-100" th:href="@{/admin/plans}"><h2 class="h5">Plans</h2><span class="text-secondary">Create and manage memberships</span></a></div>
        <div sec:authorize="hasRole('ADMIN')" class="col-md-4"><a class="card card-body text-decoration-none h-100" th:href="@{/admin/lockers/new}"><h2 class="h5">Lockers</h2><span class="text-secondary">Configure gym lockers</span></a></div>
        <div class="col-md-4"><a class="card card-body text-decoration-none h-100" th:href="@{/reception/traffic}"><h2 class="h5">Traffic</h2><span class="text-secondary">Review facility access</span></a></div>
    </div>
</main>
</body>
</html>
