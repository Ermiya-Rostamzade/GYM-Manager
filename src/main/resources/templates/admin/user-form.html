<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/admin}">

<head>
    <title>Create New User</title>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const nav = document.querySelector('nav');
            if (nav) {
                const usersLink = nav.querySelector('a[href$="/admin/users"]');
                if (usersLink) {
                    usersLink.classList.add('active');
                }
            }
        });
    </script>
</head>

<body>

    <main layout:fragment="content">
        <div class="container mt-5" style="max-width: 600px;">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h3 class="mb-0 fw-bold">Add New User</h3>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/users}" th:object="${user}" method="post">
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control"
                                th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" id="fullName"
                                th:field="*{fullName}" placeholder="e.g. Alex Johnson" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                th:errors="*{fullName}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="mobileNumber" class="form-label fw-semibold">Mobile Number</label>
                            <input type="text" class="form-control"
                                th:classappend="${#fields.hasErrors('mobileNumber')} ? 'is-invalid' : ''"
                                id="mobileNumber" th:field="*{mobileNumber}" placeholder="09123456789" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('mobileNumber')}"
                                th:errors="*{mobileNumber}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control"
                                th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" id="password"
                                th:field="*{password}" placeholder="Enter secure password" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                th:errors="*{password}"></div>
                        </div>
                        <div class="mb-4">
                            <label for="role" class="form-label fw-semibold">User Role</label>
                            <select class="form-select"
                                th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''" id="role"
                                th:field="*{role}" required>
                                <option value="" disabled selected>-- Select Role --</option>
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/users}" class="btn btn-light border text-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save User</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
