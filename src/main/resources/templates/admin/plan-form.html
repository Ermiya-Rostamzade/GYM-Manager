<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/admin}">

<head>
    <title>Create Plan</title>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const nav = document.querySelector('nav');
            if (nav) {
                const plansLink = nav.querySelector('a[href$="/admin/plans"]');
                if (plansLink) {
                    plansLink.classList.add('active');
                }
            }
        });
    </script>
</head>

<body>

    <main layout:fragment="content">
        <div class="container mt-5" style="max-width: 600px;">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h3 class="mb-0 fw-bold">Create Plan</h3>
                </div>
                <div class="card-body p-4">

                    <div th:if="${errorMessage}" class="alert alert-danger py-2" role="alert" th:text="${errorMessage}">
                    </div>

                    <form th:action="@{/admin/plans}" th:object="${plan}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold">Title</label>
                            <input type="text" class="form-control"
                                th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''" id="title"
                                th:field="*{title}" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label fw-semibold">Price</label>
                                <input type="number" class="form-control"
                                    th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" id="price"
                                    th:field="*{price}" step="0.01" min="0" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}"
                                    th:errors="*{price}">
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="durationDays" class="form-label fw-semibold">Duration (days)</label>
                                <input type="number" class="form-control"
                                    th:classappend="${#fields.hasErrors('durationDays')} ? 'is-invalid' : ''"
                                    id="durationDays" th:field="*{durationDays}" min="1" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('durationDays')}"
                                    th:errors="*{durationDays}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="totalSessions" class="form-label fw-semibold">Total Sessions</label>
                            <input type="number" class="form-control"
                                th:classappend="${#fields.hasErrors('totalSessions')} ? 'is-invalid' : ''"
                                id="totalSessions" th:field="*{totalSessions}"
                                placeholder="e.g. 12 (optional for time-based)" min="1">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('totalSessions')}"
                                th:errors="*{totalSessions}"></div>
                        </div>
                        <div class="mb-4">
                            <label for="planType" class="form-label fw-semibold">Plan Type</label>
                            <select class="form-select"
                                th:classappend="${#fields.hasErrors('planType')} ? 'is-invalid' : ''" id="planType"
                                th:field="*{planType}" required>
                                <option value="" disabled selected>Select a plan type</option>
                                <option th:each="type : ${T(com.gym.management.entity.enums.PlanType).values()}"
                                    th:value="${type}" th:text="${type}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('planType')}"
                                th:errors="*{planType}">
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/plans}" class="btn btn-light border text-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Create Plan</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
