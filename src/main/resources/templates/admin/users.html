<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/admin}">

<head>
    <title>User Management</title>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const nav = document.querySelector('nav');
            if (nav) {
                const usersLink = nav.querySelector('a[href$="/admin/users"]');
                if (usersLink) {
                    usersLink.classList.add('active');
                }
            }
        });
    </script>
</head>

<body>

    <main layout:fragment="content">
        <div class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>User Management</h2>
                <a th:href="@{/admin/users/new}" class="btn btn-primary">+ Add New User</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0 table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">#</th>
                                <th>Full Name</th>
                                <th>Mobile Number</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created At</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user, userStat: ${users}">
                                <td class="ps-4 text-muted" th:text="${userStat.count}">1</td>
                                <td class="fw-semibold" th:text="${user.fullName}">John Doe</td>
                                <td th:text="${user.mobileNumber}">09123456789</td>
                                <td><span class="badge bg-secondary" th:text="${user.role}">ADMIN</span></td>
                                <td>
                                    <span class="badge" th:classappend="${user.isActive} ? 'bg-success' : 'bg-danger'"
                                        th:text="${user.isActive} ? 'Active' : 'Inactive'">Active</span>
                                </td>
                                <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-23 10:00
                                </td>
                                <td class="text-end pe-4">
                                    <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post"
                                        style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Are you sure you want to delete this user?');">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="7" class="text-center py-5 text-muted">No users found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
