<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gym Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="card shadow-sm border-0 text-center p-5">
        <h1 class="display-5 fw-bold">Gym Management</h1>
        <p class="lead text-secondary">Manage memberships, access and facilities in one place.</p>
        <div class="d-flex justify-content-center gap-2 mt-3">
            <a class="btn btn-primary" th:href="@{/login}">Sign in</a>
            <a class="btn btn-outline-primary" th:href="@{/register}">Create account</a>
        </div>
    </div>
</main>
</body>
</html>
