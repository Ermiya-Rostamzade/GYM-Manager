<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Out - Gym Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container" style="max-width: 450px;">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-white border-bottom-0 pt-4 pb-0 text-center">
            <h3 class="mb-0 fw-bold">Scan to Check Out</h3>
        </div>
        <div class="card-body p-4 text-center">

            <div th:if="${errorMessage}" class="alert alert-danger py-2" role="alert" th:text="${errorMessage}"></div>

            <div class="mb-4 p-4 border rounded-3 bg-light d-inline-block">
                <!-- Placeholder for QR generation -->
                <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-secondary">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <rect x="7" y="7" width="3" height="3"></rect>
                    <rect x="14" y="7" width="3" height="3"></rect>
                    <rect x="7" y="14" width="3" height="3"></rect>
                    <rect x="14" y="14" width="3" height="3"></rect>
                </svg>
            </div>

            <form th:action="@{/dashboard/traffic-log/check-out/{id}(id=${trafficLogId})}" method="post">
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger fw-bold py-2">Confirm Check Out</button>
                    <a th:href="@{/dashboard/traffic-log}" class="btn btn-light border text-secondary py-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
