<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Out - Gym Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div class="container" style="max-width: 600px;">

    <div class="card">

        <h1>Traffic log - Check Out</h1>

        <form th:action="@{/dashboard/traffic/check-out/{id}(id=${trafficLogId})}"
              method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <div class="alert alert-info">Confirm your check-out when you are leaving the gym.</div>
            </div>

            <div class="form-group">
                <label for="submit">QR code backup button</label>

                <input
                        type="submit"
                        id="submit"
                        value="Check Out"
                >
            </div>

            <a class="btn btn-outline-secondary" th:href="@{/dashboard/traffic}">Back to logs</a>

        </form>

    </div>

</div>

</body>
</html>
