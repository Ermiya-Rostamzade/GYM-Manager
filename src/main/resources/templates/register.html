<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Gym Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<div class="container" style="max-width: 450px;">
    <div class="card shadow-sm border-0 rounded-3 my-5">
        <div class="card-body p-4">
            <h3 class="text-center mb-4 fw-bold">Create Account</h3>

            <form th:action="@{/register}" th:object="${user}" method="post" id="registerForm">
                <input type="hidden" th:field="*{role}" value="ATHLETE" />

                <div class="mb-3">
                    <label for="fullName" class="form-label fw-semibold">Full Name</label>
                    <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="e.g. Alex Johnson" required>
                </div>
                <div class="mb-3">
                    <label for="mobileNumber" class="form-label fw-semibold">Mobile Number</label>
                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('mobileNumber')} ? 'is-invalid' : ''" id="mobileNumber" th:field="*{mobileNumber}" placeholder="09123456789" required>
                    <div th:if="${#fields.hasErrors('mobileNumber')}" class="invalid-feedback" th:errors="*{mobileNumber}"></div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Create a password" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary fw-semibold">Sign Up</button>
                    <a th:href="@{/login}" class="btn btn-light text-secondary border">Already have an account? Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script th:src="@{/js/user.js}"></script>
</body>
</html>
