<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Admin Portal</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link active" th:href="@{/admin/users}">Users</a>
            <a class="nav-link" th:href="@{/admin/plans}">Plans</a>
            <a class="nav-link" th:href="@{/admin/lockers}">Lockers</a>
        </div>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>User Management</h2>
        <a th:href="@{/admin/users/new}" class="btn btn-primary">+ Add New User</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-4">#</th>
                    <th>Full Name</th>
                    <th>Mobile Number</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user, userStat: ${users}">
                    <td class="ps-4 text-muted" th:text="${userStat.count}">1</td>
                    <td class="fw-semibold" th:text="${user.fullName}">John Doe</td>
                    <td th:text="${user.mobileNumber}">09123456789</td>
                    <td><span class="badge bg-secondary" th:text="${user.role}">ADMIN</span></td>
                    <td>
                        <span class="badge" th:classappend="${user.isActive} ? 'bg-success' : 'bg-danger'" th:text="${user.isActive} ? 'Active' : 'Inactive'">Active</span>
                    </td>
                    <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-23 10:00</td>
                    <td class="text-end pe-4">
                        <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this user?');">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="7" class="text-center py-5 text-muted">No users found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
