<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check In - Gym Management</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container" style="max-width: 600px;">

    <div class="card">

        <h1>Traffic log - Check In</h1>

        <form th:action="@{/traffic-log/check-in}"
              th:object="${trafficLogCheckIn}"
              method="post">

            <div class="form-group">
                <img src="#" alt="QR Code Image">
            </div>

            <div class="form-group">
                <label for="submit">QR code backup button</label>

                <input
                        type="submit"
                        id="submit"
                        value="Check In"
                >

                <input
                        type="hidden"
                        name="userId"
                        value="1234"
                > <!-- Hard-coded user ID -->
            </div>

        </form>

    </div>

</div>

</body>
</html>
