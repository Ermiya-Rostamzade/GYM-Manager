<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check In - Gym Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container" style="max-width: 450px;">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-white border-bottom-0 pt-4 pb-0 text-center">
            <h3 class="mb-0 fw-bold">Manual Check-In</h3>
            <p class="text-muted mt-1 small">Simulate an entryway scan.</p>
        </div>
        <div class="card-body p-4">

            <div th:if="${errorMessage}" class="alert alert-danger py-2" role="alert" th:text="${errorMessage}"></div>

            <form th:action="@{/dashboard/traffic-log/check-in}" th:object="${trafficLogCheckIn}" method="post">
                <div class="mb-4">
                    <label for="method" class="form-label fw-semibold">Entry Method</label>
                    <select class="form-select" th:classappend="${#fields.hasErrors('method')} ? 'is-invalid' : ''" id="method" th:field="*{method}">
                        <option value="QR_CODE">QR Code</option>
                        <option value="RFID">RFID Card</option>
                        <option value="FINGERPRINT">Fingerprint</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('method')}" th:errors="*{method}"></div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary fw-bold py-2">Submit Check In</button>
                    <a th:href="@{/dashboard/traffic-log}" class="btn btn-light border text-secondary py-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
