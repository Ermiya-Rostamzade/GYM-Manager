<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5"><div class="card shadow-sm border-0 p-5 text-center">
    <h1 class="display-4">403</h1><h2>Access denied</h2>
    <p class="text-secondary" th:text="${message}">You do not have permission to access this page.</p>
    <a class="btn btn-primary" th:href="@{/}">Return home</a>
</div></main>
</body>
</html>
