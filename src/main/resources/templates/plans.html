<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plans - Gym Management</title>

    <link rel="stylesheet" th:href="@{/css/plan.css}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Gym Plans</h1>

        <a class="button" th:href="@{/admin/plans/new}">
            Create New Plan
        </a>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Price</th>
                <th>Duration</th>
                <th>Type</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="plan : ${plans}">
                <td th:text="${plan.id}"></td>
                <td th:text="${plan.title}"></td>
                <td class="price" th:text="${plan.price}"></td>
                <td th:text="${plan.durationDays} + ' days'"></td>
                <td th:text="${plan.planType}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(plans)}">
                <td class="empty" colspan="5">
                    No plans found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script th:src="@{/js/plan.js}"></script>

</body>
</html>
