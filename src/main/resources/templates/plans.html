<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plans - Gym Management</title>

    <link rel="stylesheet" th:href="@{/css/plan.css}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Gym Plans</h1>

        <a class="button" th:href="@{/admin/plans/new}">
            Create New Plan
        </a>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Title</th>
                <th>Price</th>
                <th>Duration</th>
                <th>Sessions</th>
                <th>Type</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="plan, planStat : ${plans}">
                <td th:text="${planStat.count}">1</td>
                <td th:text="${plan.title}"></td>
                <td class="price" th:text="${plan.price}"></td>
                <td th:text="${plan.durationDays} + ' days'"></td>
                <td th:text="${plan.totalSessions != null ? plan.totalSessions + ' sessions' : '-'}"></td>
                <td th:text="${plan.planType}"></td>
                <td>
                    <form th:action="@{/admin/plans/delete/{id}(id=${plan.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this plan?');">Delete</button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(plans)}">
                <td class="empty" colspan="7">
                    No plans found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script th:src="@{/js/plan.js}"></script>

</body>
</html>
