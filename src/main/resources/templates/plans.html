<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plans - Gym Management</title>
</head>
<body>

<h1>Gym Plans</h1>

<a th:href="@{/admin/plans/new}">Create New Plan</a>

<hr>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Price</th>
        <th>Duration</th>
        <th>Type</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="plan : ${plans}">
        <td th:text="${plan.id}"></td>
        <td th:text="${plan.title}"></td>
        <td th:text="${plan.price}"></td>
        <td th:text="${plan.durationDays} + ' days'"></td>
        <td th:text="${plan.planType}"></td>
    </tr>

    <tr th:if="${#lists.isEmpty(plans)}">
        <td colspan="5">No plans found.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
