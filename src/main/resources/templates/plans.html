<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plans - Gym Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Admin Portal</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/admin/users}">Users</a>
            <a class="nav-link active" th:href="@{/admin/plans}">Plans</a>
            <a class="nav-link" th:href="@{/admin/lockers}">Lockers</a>
        </div>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gym Plans</h2>
        <a th:href="@{/admin/plans/new}" class="btn btn-primary">+ Create New Plan</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-4">#</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Duration</th>
                    <th>Sessions</th>
                    <th>Type</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="plan, planStat : ${plans}">
                    <td class="ps-4 text-muted" th:text="${planStat.count}">1</td>
                    <td class="fw-semibold" th:text="${plan.title}">Plan</td>
                    <td class="price" th:text="${plan.price}"></td>
                    <td th:text="${plan.durationDays} + ' days'"></td>
                    <td th:text="${plan.totalSessions != null ? plan.totalSessions + ' sessions' : '-'}"></td>
                    <td><span class="badge bg-info text-dark" th:text="${plan.planType}"></span></td>
                    <td class="text-end pe-4">
                        <form th:action="@{/admin/plans/delete/{id}(id=${plan.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this plan?');">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(plans)}">
                    <td colspan="7" class="text-center py-5 text-muted">No plans found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script th:src="@{/js/plan.js}"></script>
</body>
</html>
