<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/dashboard}">

<head>
    <title>Choose a Plan</title>
</head>

<body>

    <main layout:fragment="content">
        <div class="container mt-5">
            <div class="text-center mb-5">
                <h2 class="fw-bold">Select a Membership Plan</h2>
                <p class="text-muted">Choose the package that best fits your workout goals.</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger text-center mx-auto" style="max-width: 500px;"
                role="alert" th:text="${errorMessage}"></div>

            <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
                <div th:each="plan : ${plans}" class="col">
                    <div class="card h-100 shadow-sm border-0 rounded-4 text-center">
                        <div class="card-body d-flex flex-column p-4">
                            <h4 class="card-title fw-bold text-uppercase text-primary mb-3" th:text="${plan.title}">Gold
                                Plan</h4>
                            <h2 class="mb-4 fw-bold">
                                <span class="price" th:text="${plan.price}"></span> <small
                                    class="text-muted fs-6">Tomans</small>
                            </h2>
                            <ul class="list-unstyled text-start mb-4 mx-auto" style="max-width: 200px;">
                                <li class="mb-2">⏳ <strong>Duration:</strong> <span
                                        th:text="${plan.durationDays} + ' days'"></span></li>
                                <li class="mb-2">🏋️ <strong>Sessions:</strong> <span
                                        th:text="${plan.totalSessions != null ? plan.totalSessions : 'Unlimited'}"></span>
                                </li>
                                <li>🏷️ <strong>Type:</strong> <span th:text="${plan.planType}"></span></li>
                            </ul>
                            <form th:action="@{/dashboard/purchase}" method="post" class="mt-auto">
                                <input type="hidden" name="planId" th:value="${plan.id}" />
                                <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-3">Pay &
                                    Activate Now</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
