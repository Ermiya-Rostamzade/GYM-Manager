<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - Gym Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="text-center p-5 bg-white shadow-sm rounded">
    <h1 class="display-1 text-danger">Oops!</h1>
    <h3 class="mb-4">Something went wrong.</h3>
    <p class="text-muted" th:text="${errorMessage}">An unexpected error occurred.</p>
    <a href="/" class="btn btn-primary mt-3">Return to Home</a>
</div>
</body>
</html>
