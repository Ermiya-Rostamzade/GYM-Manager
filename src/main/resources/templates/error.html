<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/public}">

<head>
    <title>Error</title>
</head>

<body>

    <main layout:fragment="content" class="bg-light d-flex align-items-center justify-content-center vh-100">
        <div class="text-center p-5 bg-white shadow-sm rounded">
            <h1 class="display-1 text-danger">Oops!</h1>
            <h3 class="mb-4">Something went wrong.</h3>
            <p class="text-muted" th:text="${errorMessage}">An unexpected error occurred.</p>
            <a href="/" class="btn btn-primary mt-3">Return to Home</a>
        </div>
    </main>

</body>

</html>
